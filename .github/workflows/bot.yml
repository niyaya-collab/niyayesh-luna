name: Moon journal

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
    - cron: "10,25,40,55 * * * *"

permissions:
  contents: write

concurrency:
  group: moon-journal
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          HOME_USERNAME: ${{ secrets.HOME_USERNAME }}
          PARTNER_CHAT_ID: ${{ secrets.PARTNER_CHAT_ID }}
          WATCH_SECONDS: "3600"
          AUTO_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/index.js
      - name: Save the journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git pull --rebase origin main || true
          date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          git add .heartbeat
          if [ -f data/state.enc ]; then
            # never replace a larger remote journal with a tiny empty one
            remote_size=$(git cat-file -s origin/main:data/state.enc 2>/dev/null || echo 0)
            local_size=$(wc -c < data/state.enc)
            if [ "$local_size" -ge 200 ] || [ "$remote_size" -lt 200 ]; then
              git add -- data/state.enc
            else
              echo "Skip journal overwrite (local too small vs remote)"
              git checkout origin/main -- data/state.enc || true
            fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Heartbeat + journal" || true
          fi
          git pull --rebase origin main || true
          git push origin HEAD:main || true
